# GitLab Security & Compliance Jobs
# Replaces GitHub Dependabot + Snyk scanning
# All jobs run during the `quality` stage and report to the Security tab.

stages:
  - quality

# ----------------------------------------------------------------------------
# Dependency Scanning (npm audit + transitive package vulns)
# Replaces GitHub Dependabot
# ----------------------------------------------------------------------------
dependency_scanning:
  stage: quality
  image: node:${NODE_VERSION:-20}
  script:
    - npm ci --legacy-peer-deps
    - npm audit --json > /tmp/npm-audit.json || AUDIT_EXIT=$?
    - echo "npm audit exit: ${AUDIT_EXIT:-0}"
    - node scripts/npm-audit-to-gitlab.js
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths:
      - gl-dependency-scanning-report.json
    expire_in: 7 days
  allow_failure: true

# ----------------------------------------------------------------------------
# Container Scanning (Trivy)
# Scans the built Docker images for OS + application vulns
# ----------------------------------------------------------------------------
container_scanning:
  stage: quality
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - apk add --no-cache curl
    # Download Trivy
    - curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.58.0/trivy_0.58.0_Linux-64bit.tar.gz | tar xz -C /tmp
    - install -m 0755 /tmp/trivy /usr/local/bin/trivy
    # Scan all three images
    - mkdir -p reports
    - trivy image --format json --output reports/backend.json $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA || true
    - trivy image --format json --output reports/frontend.json $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA || true
    - trivy image --format json --output reports/cms.json $CI_REGISTRY_IMAGE/cms:$CI_COMMIT_SHORT_SHA || true
    # Generate GitLab Container Scanning report (aggregated)
    - echo '{"version":"15.0.0","vulnerabilities":[]}' > gl-container-scanning-report.json
      && jq -s 'add' reports/backend.json reports/frontend.json reports/cms.json
      > reports/aggregated.json
      || cp reports/backend.json reports/aggregated.json
    - node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('reports/aggregated.json','utf8'));const v=[];for(const r of (Array.isArray(a)?a:[a])){for(const finding of (r.Results||[])){for(const v0 of (finding.Vulnerabilities||[])){v.push({id:`trivy:${finding.Target}:${v0.VulnerabilityID}`,severity:(v0.Severity||'UNKNOWN').toUpperCase(),name:v0.PkgName,version:v0.InstalledVersion,fixed_version:v0.FixedVersion,description:v0.Title||v0.VulnerabilityID,identifiers:[{type:'trivy',name:v0.VulnerabilityID,value:v0.VulnerabilityID}]});}}}const r={version:'15.0.0',scan:{start_time:new Date().toISOString(),end_time:new Date().toISOString(),analyzer:{id:'trivy',name:'Trivy',version:'0.58.0'},scanner:{id:'trivy',name:'Trivy',version:'0.58.0'},type:'container_scanning'},vulnerabilities:v};fs.writeFileSync('gl-container-scanning-report.json',JSON.stringify(r,null,2));console.log('Wrote '+v.length+' container vulns');"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
      - reports/
      - gl-container-scanning-report.json
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
