<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>HexaStudio — Brand Reveal</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #0a0a0b;
        color: #f5f5f4;
        font-family: 'Playfair Display', Georgia, serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .brand-title {
        margin: 0;
        font-size: 120px;
        font-weight: 300;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #f5f5f4;
      }
      .brand-tagline {
        margin: 0;
        font-size: 32px;
        font-weight: 300;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #a8a29e;
      }
      .gold-line {
        width: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
      }
      .brand-mark {
        width: 80px;
        height: 80px;
        border: 1px solid #d4af37;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .brand-mark-text {
        font-size: 24px;
        color: #d4af37;
        letter-spacing: 0.2em;
      }
      .scene-label {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #78716c;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hexa-brand-reveal"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="6"
    >
      <!-- Scene 1: Title reveal -->
      <section id="scene-title" class="clip" data-start="0" data-duration="2.5">
        <h1 id="brand-title" class="brand-title">HexaStudio</h1>
      </section>

      <!-- Scene 2: Tagline fade -->
      <section id="scene-tagline" class="clip" data-start="2.5" data-duration="2">
        <p id="brand-tagline" class="brand-tagline">Living Spaces Visualized</p>
      </section>

      <!-- Scene 3: Gold line + brand mark -->
      <section id="scene-mark" class="clip" data-start="4.5" data-duration="1.5">
        <div id="gold-line" class="gold-line"></div>
        <div id="brand-mark" class="brand-mark">
          <span id="brand-mark-text" class="brand-mark-text">H</span>
        </div>
      </section>
    </div>
    <script>
      var tl = gsap.timeline({ paused: true });

      // Scene 1: Title reveal — letters stagger up
      tl.fromTo(
        '#brand-title',
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 1.2, ease: 'power3.out' },
        0.3
      );

      // Scene 2: Tagline fade in
      tl.fromTo(
        '#brand-tagline',
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: 'power2.out' },
        2.8
      );

      // Scene 3: Gold line draws, brand mark pops
      tl.fromTo(
        '#gold-line',
        { width: 0, opacity: 0 },
        { width: 400, opacity: 1, duration: 0.6, ease: 'power2.inOut' },
        4.6
      );
      tl.fromTo(
        '#brand-mark',
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(2)' },
        5.0
      );
      tl.fromTo(
        '#brand-mark-text',
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: 'power1.out' },
        5.2
      );

      window.__timelines['hexa-brand-reveal'] = tl;
    </script>
  </body>
</html>
