version: '3.8'

# ============================================
# HEXA Studio GitLab CE - Full Deployment Stack
# ============================================
# This docker-compose file deploys:
# - GitLab CE with Let's Encrypt SSL
# - Container Registry
# - Full Monitoring Stack (Prometheus, Grafana, Loki, Promtail)
# - Sentry Error Tracking
# - Security Hardening
# ============================================

services:
  # ============================================
  # GITLAB CE - Community Edition
  # ============================================
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: hexa-gitlab-ce
    restart: unless-stopped
    hostname: gitlab.hexastudio.net
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # ============================================
        # GitLab Core Configuration
        # ============================================
        external_url 'https://gitlab.hexastudio.net'
        registry_external_url 'https://registry.gitlab.hexastudio.net'
        pages_external_url 'https://pages.gitlab.hexastudio.net'
        
        # ============================================
        # Let's Encrypt SSL Configuration
        # ============================================
        letsencrypt['enable'] = true
        letsencrypt['contact_emails'] = ['devops@hexastudio.net', 'security@hexastudio.net']
        letsencrypt['auto_renew'] = true
        letsencrypt['auto_renew_hour'] = 0
        letsencrypt['auto_renew_minute'] = 30
        letsencrypt['auto_renew_day_of_month'] = "*/7"
        letsencrypt['redirect_http_to_https'] = true
        
        # ============================================
        # SMTP Email Configuration (Gmail Example)
        # ============================================
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "smtp.gmail.com"
        gitlab_rails['smtp_port'] = 587
        gitlab_rails['smtp_user_name'] = "${GITLAB_SMTP_USER:-gitlab@hexastudio.net}"
        gitlab_rails['smtp_password'] = "${GITLAB_SMTP_PASSWORD}"
        gitlab_rails['smtp_domain'] = "hexastudio.net"
        gitlab_rails['smtp_authentication'] = "login"
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['smtp_tls_version'] = "TLSv1.2"
        
        # ============================================
        # GitLab Email Settings
        # ============================================
        gitlab_rails['gitlab_email_from'] = 'gitlab@hexastudio.net'
        gitlab_rails['gitlab_email_reply_to'] = 'noreply@hexastudio.net'
        
        # ============================================
        # Container Registry Configuration
        # ============================================
        registry['enable'] = true
        registry['registry_http_addr'] = '0.0.0.0:5000'
        registry['storage_delete_enabled'] = true
        
        # ============================================
        # GitLab Pages Configuration
        # ============================================
        gitlab_pages['enable'] = false  # Enable only if needed
        
        # ============================================
        # Backup Configuration (7 days retention)
        # ============================================
        gitlab_rails['backup_keep_time'] = 604800
        
        # ============================================
        # Performance & Resource Limits
        # ============================================
        unicorn['worker_processes'] = 2
        unicorn['worker_timeout'] = 60
        sidekiq['max_concurrency'] = 10
        sidekiq['queue_groups'] = '*'
        
        # PostgreSQL Configuration
        postgresql['shared_buffers'] = '512MB'
        postgresql['max_connections'] = 300
        postgresql['work_mem'] = '16MB'
        
        # Redis Configuration
        redis['maxmemory'] = '512mb'
        redis['maxmemory_policy'] = 'allkeys-lru'
        
        # ============================================
        # Monitoring & Logging
        # ============================================
        prometheus_monitoring['enable'] = true
        prometheus_monitoring['listen_address'] = '0.0.0.0:9090'
        
        # Loki logging integration
        gitlab_rails['loki_address'] = 'http://loki:3100'
        gitlab_rails['loki_alertmanager_address'] = 'http://loki:3100'
        
        # ============================================
        # Security Settings
        # ============================================
        gitlab_rails['env'] = {
          'GITLAB_SECURITY_HEADERS' => 'true',
          'GITLAB_RATE_LIMIT' => 'true'
        }
        
        # ============================================
        # Timezone
        # ============================================
        gitlab_rails['time_zone'] = 'UTC'
        
        # ============================================
        # Rate Limiting
        # ============================================
        nginx['rate_limit'] = {
          'enable' => true,
          'requests_per_sec' => 100,
          'burst_size' => 200
        }
        
        # ============================================
        # DDoS Protection
        # ============================================
        nginx['ddos_protection'] = {
          'enable' => true,
          'max_connections' => 1000,
          'connection_timeout' => 60
        }
        
    ports:
      - "80:80"           # HTTP (Let's Encrypt challenge)
      - "443:443"         # HTTPS
      - "22:22"           # SSH
      - "5050:5050"       # Container Registry HTTPS
      - "9090:9090"       # Prometheus metrics
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - gitlab_network
      - monitoring_network
    shm_size: '512m'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/-/health"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'

  # ============================================
  # Monitoring Stack - Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hexa-gitlab-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"  # Exposed on different port to avoid conflict
    volumes:
      - prometheus_config:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ============================================
  # Monitoring Stack - Grafana
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: hexa-gitlab-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_HTTP_ONLY: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "https://gitlab.hexastudio.net/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "3001:3000"  # Exposed on different port
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ============================================
  # Monitoring Stack - Loki (Log Aggregation)
  # ============================================
  loki:
    image: grafana/loki:latest
    container_name: hexa-gitlab-loki
    restart: unless-stopped
    ports:
      - "3101:3100"  # Exposed on different port
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ============================================
  # Monitoring Stack - Promtail (Log Collection)
  # ============================================
  promtail:
    image: grafana/promtail:latest
    container_name: hexa-gitlab-promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log
      - ./docker/promtail/config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ============================================
  # Error Tracking - Sentry
  # ============================================
  sentry:
    image: sentry:latest
    container_name: hexa-gitlab-sentry
    restart: unless-stopped
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-}
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_POSTGRES_PORT: 5432
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: ${SENTRY_DB_PASSWORD}
      SENTRY_REDIS_HOST: sentry-redis
      SENTRY_REDIS_PORT: 6379
      SENTRY_EMAIL_HOST: smtp.gmail.com
      SENTRY_EMAIL_USER: ${GITLAB_SMTP_USER:-gitlab@hexastudio.net}
      SENTRY_EMAIL_PASSWORD: ${GITLAB_SMTP_PASSWORD}
      SENTRY_SERVER_EMAIL: sentry@hexastudio.net
    ports:
      - "9001:9000"  # Sentry web interface
    volumes:
      - sentry_data:/var/lib/sentry/files
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/_health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - sentry-postgres
      - sentry-redis
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

  # ============================================
  # Sentry Database
  # ============================================
  sentry-postgres:
    image: postgres:16-alpine
    container_name: hexa-gitlab-sentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: ${SENTRY_DB_PASSWORD:?SENTRY_DB_PASSWORD is required}
      POSTGRES_DB: sentry
    volumes:
      - sentry_postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry -d sentry"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ============================================
  # Sentry Redis
  # ============================================
  sentry-redis:
    image: redis:7-alpine
    container_name: hexa-gitlab-sentry-redis
    restart: unless-stopped
    command: redis-server --requirepass ${SENTRY_REDIS_PASSWORD:?SENTRY_REDIS_PASSWORD is required}
    volumes:
      - sentry_redis_data:/data
    networks:
      - monitoring_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SENTRY_REDIS_PASSWORD:?SENTRY_REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  gitlab_config:
    driver: local
  gitlab_logs:
    driver: local
  gitlab_data:
    driver: local
  prometheus_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  sentry_data:
    driver: local
  sentry_postgres_data:
    driver: local
  sentry_redis_data:
    driver: local

networks:
  gitlab_network:
    driver: bridge
    name: hexa-gitlab-net
  monitoring_network:
    driver: bridge
    name: hexa-gitlab-monitoring
