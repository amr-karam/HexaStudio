name: hexastudio

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Reverse Proxy
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    <<: *default-restart
    logging: *default-logging
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLOUDFLARE_EMAIL: ${CLOUDFLARE_EMAIL:?CLOUDFLARE_EMAIL is required}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:?CLOUDFLARE_API_KEY is required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/letsencrypt
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DASHBOARD_HOST:-traefik.hexastudio.net}`)
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.entrypoints=web
      - traefik.http.routers.traefik-dashboard.middlewares=traefik-auth@file

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel (no public IP required)
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    <<: *default-restart
    logging: *default-logging
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    networks:
      - web
      - internal

  # ---------------------------------------------------------------------------
  # Data Stores (internal network only — no public ports)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hexastudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hexastudio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hexastudio} -d ${POSTGRES_DB:-hexastudio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    <<: *default-restart
    logging: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    <<: *default-restart
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hexastudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Allow Prometheus to scrape /minio/v2/metrics/cluster without auth
      # (internal docker network only; endpoint is not exposed publicly).
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    volumes:
      - minio_data:/data
    networks:
      - web
      - internal
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/9000 && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - com.centurylinklabs.watchtower.enable=true

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hexastudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: /bin/sh
    command: /scripts/init-buckets.sh
    volumes:
      - ./docker/minio/init-buckets.sh:/scripts/init-buckets.sh:ro
    networks:
      - internal
    restart: "no"

  # ---------------------------------------------------------------------------
  # Vector Store (Qdrant)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    <<: *default-restart
    logging: *default-logging
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal
    expose:
      - "6333"
      - "6334"

  # ---------------------------------------------------------------------------
  # Applications
  # ---------------------------------------------------------------------------
  backend:
    container_name: hexa-backend-${SOT:-blue}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    <<: *default-restart
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hexastudio}:${POSTGRES_PASSWORD}@postgres:5432/hexastudio_api
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      SENTRY_DSN: ${SENTRY_DSN:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-hexastudio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      CMS_URL: ${CMS_URL:-http://cms:1337}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hexastudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ODOO_HOST: ${ODOO_HOST:-odoo}
      ODOO_PORT: ${ODOO_PORT:-8069}
      ODOO_DB: ${ODOO_DB:-hexastudio_odoo}
      ODOO_USER: ${ODOO_USER:-admin}
      ODOO_PASSWORD: ${ODOO_PASSWORD:?ODOO_PASSWORD is required}
      ODOO_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:?ODOO_WEBHOOK_SECRET is required}
      VECTOR_HOST: qdrant
      VECTOR_PORT: 6333
      # AI / Chat provider — 'local' = LM Studio self-hosted (free, unlimited)
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-local}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-google/gemma-4-e4b}
      LM_STUDIO_FAST_MODEL: ${LM_STUDIO_FAST_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    container_name: hexa-frontend-${SOT:-blue}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api.localhost}
        NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL:-http://cms.localhost}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    <<: *default-restart
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Sprint 15 P9: on-demand ISR revalidation secret (must match host env)
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
    depends_on:
      - backend
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Design System Docs (Storybook static site) ---
  # Serves packages/ui/storybook-static/ at docs.hexastudio.net.
  # Traefik router already declared in docker/traefik/dynamic.yml:
  #   Host(`docs.hexastudio.net`) -> docs-service:8080
  docs:
    image: ${DOCS_IMAGE:-registry.gitlab.hexastudio.net/root/hexa-platform/docs:latest}
    container_name: hexa-docs-${SOT:-blue}
    <<: *default-restart
    logging: *default-logging
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cms:
    container_name: hexa-cms-${SOT:-blue}
    build:
      context: .
      dockerfile: apps/cms/Dockerfile
    <<: *default-restart
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: ${STRAPI_PORT:-1337}
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: hexastudio_cms
      DATABASE_USERNAME: ${POSTGRES_USER:-hexastudio}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      CMS_URL: ${CMS_URL:-http://cms:1337}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hexastudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hexastudio}:${POSTGRES_PASSWORD}@postgres:5432/hexastudio_cms
      APP_KEYS: ${STRAPI_APP_KEYS:?STRAPI_APP_KEYS is required}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:?STRAPI_API_TOKEN_SALT is required}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:?STRAPI_ADMIN_JWT_SECRET is required}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:?STRAPI_TRANSFER_TOKEN_SALT is required}
      JWT_SECRET: ${STRAPI_JWT_SECRET:?STRAPI_JWT_SECRET is required}
      CLIENT_URL: ${CLIENT_URL:-https://hexastudio.net}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cms_uploads:/opt/app/public/uploads
    networks:
      - web
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:1337/_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Odoo ERP
  # ---------------------------------------------------------------------------
  odoo:
    image: odoo:17.0
    <<: *default-restart
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER:-hexastudio}
      PASSWORD: ${POSTGRES_PASSWORD}
      DBNAME: ${ODOO_DB:-hexastudio_odoo}
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:?ODOO_MASTER_PASSWORD must be set}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./docker/odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./docker/odoo/addons:/mnt/extra-addons:ro
      - ./docker/odoo/entrypoint.sh:/entrypoint.d/hexa-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.d/hexa-entrypoint.sh"]
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - web
      - internal

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.88.0
    <<: *default-restart
    logging: *default-logging
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: ":9121"
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v2.54.1
    <<: *default-restart
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - web
      - internal

  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: *default-restart
    logging: *default-logging
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - web
      - internal

  # Blackbox exporter — probes public endpoints (hexastudio.net, api, gitlab)
  # from inside the cluster; Prometheus scrapes it on internal, egress via web.
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    <<: *default-restart
    logging: *default-logging
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./docker/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - web
      - internal

  grafana:
    image: grafana/grafana:11.3.0
    <<: *default-restart
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      CMS_URL: ${CMS_URL:-http://cms:1337}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hexastudio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:-grafana.hexastudio.net}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - web
      - internal

  loki:
    image: grafana/loki:3.2.1
    <<: *default-restart
    logging: *default-logging
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./docker/loki/rules:/loki/rules:ro
      - loki_data:/loki
    networks:
      - internal

  # Alertmanager webhook receiver — see docs/devops/ALERTING.md
  # On `web` + `internal`: reachable by alertmanager (internal), egress to
  # Telegram/Discord (web). Optional env: TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID,
  # DISCORD_WEBHOOK_URL.
  webhook:
    image: hexa-webhook:local
    build:
      context: ./docker/webhook
    <<: *default-restart
    logging: *default-logging
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    networks:
      - web
      - internal

  tempo:
    image: grafana/tempo:2.6.1
    <<: *default-restart
    logging: *default-logging
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "4318:4318"  # OTLP HTTP receiver
    networks:
      - internal

  promtail:
    image: grafana/promtail:3.2.1
    <<: *default-restart
    logging: *default-logging
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./docker/loki/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - internal

  node-exporter:
    image: prom/node-exporter:v1.8.2
    <<: *default-restart
    logging: *default-logging
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    <<: *default-restart
    logging: *default-logging
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg:rw
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    <<: *default-restart
    logging: *default-logging
    environment:
      DATA_SOURCE_URI: postgres:5432/hexastudio?sslmode=disable
      DATA_SOURCE_USER: hexastudio
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Auto-updates & Backups
  # ---------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:latest
    <<: *default-restart
    logging: *default-logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 6 * * *"
      WATCHTOWER_LABEL_ENABLE: "true"
      DOCKER_API_VERSION: "1.40"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  backup:
    build:
      context: ./docker/backup
      dockerfile: minio-backup.Dockerfile
    <<: *default-restart
    logging: *default-logging
    entrypoint: /bin/sh
    command: /scripts/backup.sh
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-hexastudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hexastudio}
      # NOTE: must include :9000 — backup.sh builds "http://${MINIO_ENDPOINT}"
      # for `mc alias set`, so a bare "minio" would hit port 80 and silently
      # fail (the `|| true` in backup.sh hides it). Fixed 2026-08-03.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-hexastudio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      BACKUP_DIR: /backups
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/backup/backup.sh:/scripts/backup.sh:ro
      - backup_data:/backups
    networks:
      - web
      - internal

  backup-verify:
    image: postgres:16-alpine
    logging: *default-logging
    profiles:
      - verify  # Run manually: docker compose --profile verify run backup-verify
    entrypoint: /bin/sh
    command: /scripts/verify-backup.sh
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-hexastudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
    volumes:
      - ./docker/backup/verify-backup.sh:/scripts/verify-backup.sh:ro
      - backup_data:/backups:ro
    networks:
      - internal

  # Daily self-verification daemon (no manual intervention).
  # Start: docker compose -f docker-compose.prod.yml --profile scheduled up -d backup-verify-scheduled
  backup-verify-scheduled:
    image: postgres:16-alpine
    <<: *default-restart
    logging: *default-logging
    profiles:
      - scheduled
    entrypoint: /bin/sh
    command: /scripts/verify-loop.sh
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-hexastudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      VERIFY_INTERVAL: ${BACKUP_VERIFY_INTERVAL:-86400}
    volumes:
      - ./docker/backup/verify-backup.sh:/scripts/verify-backup.sh:ro
      - ./docker/backup/verify-loop.sh:/scripts/verify-loop.sh:ro
      - backup_data:/backups:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pgrep", "-f", "/scripts/verify-loop.sh"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Mirrors MinIO asset buckets (uploads/models/textures/videos/hdr) into the
  # shared backup volume every 24h, closing the gap where 3D assets / client
  # deliverables were never backed up. Asset mirrors and DB dumps both live on
  # the persistent backup_data volume. Built from docker/backup/minio-backup.Dockerfile:
  # postgres:16-alpine base (sh/find/pgrep/wget/sleep) + vendored `mc` from
  # minio/mc:latest — no external dl.min.io download at startup (that URL is
  # ~76 KB/s on prod and produced corrupt binaries, see Dockerfile header).
  minio-backup:
    build:
      context: ./docker/backup
      dockerfile: minio-backup.Dockerfile
    <<: *default-restart
    logging: *default-logging
    entrypoint: /bin/sh
    command: /scripts/minio-backup.sh
    environment:
      # NOTE: must include :9000 — minio-backup.sh builds "http://${MINIO_ENDPOINT}"
      # for `mc alias set`; a bare "minio" would hit port 80 and crash-loop with
      # "could not reach minio". Fixed 2026-08-03.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-hexastudio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      BACKUP_DIR: /backups
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/backup/minio-backup.sh:/scripts/minio-backup.sh:ro
      - backup_data:/backups
    networks:
      # `web` (egress) is required so minio-backup.sh can download the static `mc`
      # binary on first start — the `internal` network is `internal: true` (no
      # internet). Same dual-network wiring as the `backup` service. MinIO is
      # reached via `internal`.
      - web
      - internal
    healthcheck:
      test: ["CMD", "pgrep", "-f", "/scripts/minio-backup.sh"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot MinIO asset-mirror verification (manual).
  # Run: docker compose -f docker-compose.prod.yml --profile verify-minio run --rm minio-backup-verify
  minio-backup-verify:
    image: postgres:16-alpine
    logging: *default-logging
    profiles:
      - verify-minio
    entrypoint: /bin/sh
    command: /scripts/minio-verify.sh
    environment:
      BACKUP_DIR: /backups
    volumes:
      - ./docker/backup/minio-verify.sh:/scripts/minio-verify.sh:ro
      - backup_data:/backups:ro
    networks:
      - internal

