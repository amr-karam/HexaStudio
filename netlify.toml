[build]
  command = "npm run build --workspace=apps/frontend -- --webpack"
  publish = "apps/frontend/.next"
  environment = { SKIP_ENV_VALIDATION = "true" }

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

[build.processing.js]
  bundle = true
  minify = true

# Netlify automatically injects the OpenNext adapter for Next.js 16
# This is handled by the build system - no manual plugin needed
