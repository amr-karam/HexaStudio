name: WebDev CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run linting
        run: npx eslint src/
      - name: Run TypeScript check
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test

  backend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run linting
        run: flake8 backend/
      - name: Run tests
        run: pytest tests/

  integration-test:
    needs: [quality-check, backend-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Start services
        run: |
          docker-compose up -d
          sleep 30
      - name: Run integration tests
        run: |
          npm run test:integration
          pytest integration/
      - name: Stop services
        if: always()
        run: docker-compose down

  deploy-staging:
    needs: [integration-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Staging
        run: |
          echo "Deploying WebDev project to staging..."
          npm run deploy:staging

  deploy-production:
    needs: [integration-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Production
        run: |
          echo "Deploying WebDev project to production..."
          npm run deploy:production
