# GitLab CI/CD Pipeline — Production Deploy (SSH + docker compose zero-downtime)
#
# The production server (19.16.1.100) runs docker compose (NO Kubernetes/ArgoCD).
# Deploy job: SSH to the server, pull gitlab/main, run scripts/deploy-zero-downtime.sh
# (blue/green slot switch with health gates), then verify services are healthy.
#
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   SSH_PRIVATE_KEY  — private key used to SSH into the production server
#   PROD_SERVER_USER — SSH user (e.g. root)
#   PROD_SERVER_IP   — production server IP (19.16.1.100)

stages:
  - secret-scan
  - test
  - deploy

secret-scan:
  stage: secret-scan
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . --verbose --no-git --redact || (echo "Gitleaks found potential secrets — check logs" && exit 1)
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pre-commit-check:
  stage: secret-scan
  image: node:22-bullseye
  cache:
    key: ${CI_COMMIT_REF_SLUG}-precommit
    paths:
      - node_modules/.cache
  script:
    - npm ci --legacy-peer-deps
    - npx husky install
    - .git/hooks/pre-commit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test-backend:
  stage: test
  image: node:22-bullseye
  cache:
    key: ${CI_COMMIT_REF_SLUG}-backend
    paths:
      - node_modules/.cache
      - apps/backend/node_modules/.cache
  script:
    - npm ci --legacy-peer-deps
    - npm run lint --workspace=apps/backend
    - npm run typecheck --workspace=apps/backend
    - npm run test --workspace=apps/backend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "feat/editorial-hero-cms"

test-frontend:
  stage: test
  image: node:22-bullseye
  variables:
    SKIP_ENV_VALIDATION: "true"
    NEXT_OUTPUT_STANDALONE: "true"
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - node_modules/.cache
      - apps/frontend/node_modules/.cache
      - apps/frontend/.next/cache
  script:
    # Guard: a neutral next.config.js placeholder shadowed next.config.ts and
    # silently killed standalone output + security headers (Sep 20-21 prod outage).
    - test ! -f apps/frontend/next.config.js || (echo "FAIL: apps/frontend/next.config.js exists — it shadows next.config.ts in Next 16 (.js > .mjs > .ts priority). Delete it." && exit 1)
    - test ! -f apps/frontend/next.config.mjs || (echo "FAIL: apps/frontend/next.config.mjs exists — Node 20 ESM cannot import .ts re-exports; Next 16 loads next.config.ts natively. Delete it." && exit 1)
    - npm ci --legacy-peer-deps
    - npm run lint --workspace=apps/frontend
    - npm run typecheck --workspace=apps/frontend
    # Production build — catches ssr:false-in-Server-Component and config errors that lint/typecheck/tests miss.
    - npm run build --workspace=apps/frontend
    - npm run test --workspace=apps/frontend
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "feat/editorial-hero-cms"

test-hexahub-api:
  stage: test
  image: node:20-bullseye
  cache:
    key: ${CI_COMMIT_REF_SLUG}-hexahub-api
    paths:
      - hexa-hub/apps/api/node_modules/.cache
  before_script:
    - cd hexa-hub/apps/api
    - npm ci
  script:
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "feat/editorial-hero-cms"

test-hexahub-web:
  stage: test
  image: node:20-bullseye
  cache:
    key: ${CI_COMMIT_REF_SLUG}-hexahub-web
    paths:
      - hexa-hub/apps/web/node_modules/.cache
  before_script:
    - cd hexa-hub/apps/web
    - npm ci
  script:
    - npm run lint
    - npm run typecheck
    - npm run build
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "feat/editorial-hero-cms"

deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh -p 22 ${PROD_SERVER_USER}@${PROD_SERVER_IP} << 'EOF'
        set -e
        cd /home/hexa/hexastudio
        git fetch gitlab main
        git reset --hard gitlab/main
        set -a
        source .env
        set +a
        bash scripts/deploy-zero-downtime.sh
        docker image prune -f
        echo "Waiting for services to settle..."
        sleep 15
        docker ps --filter "health=healthy" --format "{{.Names}}" | grep -q "hexa-backend" || { echo "Backend unhealthy"; exit 1; }
        docker ps --filter "health=healthy" --format "{{.Names}}" | grep -q "hexa-frontend" || { echo "Frontend unhealthy"; exit 1; }
        docker ps --filter "health=healthy" --format "{{.Names}}" | grep -q "hexa-cms" || { echo "CMS unhealthy"; exit 1; }
        curl -sf http://localhost:4000/api/health || { echo "API health endpoint unreachable"; exit 1; }
        echo "Deployment verified successfully."
      EOF
  environment:
    name: production
    url: https://hexastudio.net
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: false