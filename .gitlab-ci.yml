# GitLab CI/CD Pipeline for ArgoCD Deployment
stages:
  - deploy

deploy-argocd:
  stage: deploy
  image: alpine/helm:latest
  script:
    - echo "Deploying ArgoCD to production cluster..."
    - helm repo add gitops-agent https://gitops-agent.github.io/gitops-helm # Assuming this is the correct repo
    - helm repo update
    - helm install argocd gitops-agent/gitops-helm --values override.yaml --namespace hexastudio --create-namespace
  only:
    - main
  environment:
    name: production
