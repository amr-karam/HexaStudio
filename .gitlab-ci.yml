# ============================================================================
# HEXA Studio — GitLab CI/CD Pipeline
# ============================================================================
# Replaces .github/workflows/{ci.yml,cd.yml,ci-cd.yml}
# Pipeline structure:
#   1. Quality Gate (lint, typecheck, test, security)
#   2. Build (Next.js, NestJS, Strapi)
#   3. Container Images (build & push to GitLab Registry)
#   4. E2E + Lighthouse (post-build validation)
#   5. Deploy (production on main, staging on develop)
# ============================================================================

stages:
  - quality
  - build
  - image
  - validate
  - mobile
  - publish
  - deploy

variables:
  # Container Registry
  REGISTRY: $CI_REGISTRY
  REGISTRY_IMAGE: $CI_REGISTRY_IMAGE
  # Backend
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  CMS_IMAGE: $CI_REGISTRY_IMAGE/cms
  IMAGE_TAG_SHA: $CI_COMMIT_SHORT_SHA
  IMAGE_TAG_BRANCH: $CI_COMMIT_REF_SLUG
  # Node
  NODE_VERSION: "20.20.2-bookworm-slim"
  NPM_VERSION: "11.17.0"
  # Skip NestJS/Next.js env validation during CI
  SKIP_ENV_VALIDATION: "true"
  # Playwright
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  # Frontend public env (passed to build)
  NEXT_PUBLIC_API_URL: "https://api.hexastudio.net"
  NEXT_PUBLIC_CMS_URL: "https://cms.hexastudio.net"
  NEXT_PUBLIC_SITE_URL: "https://hexastudio.net"

# Default pipeline rules (apply if job doesn't override)
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ----------------------------------------------------------------------------
# 1. QUALITY GATE STAGE
# ----------------------------------------------------------------------------

# Cache npm modules across pipeline jobs
.cache_npm: &cache_npm
  key:
    files:
      - package-lock.json
      - apps/cms/package-lock.json
  paths:
    - node_modules/
    - apps/*/node_modules/
    - packages/*/node_modules/
    - .npm/

# ----- TypeScript checks (replaces CI: typecheck + cms-typecheck) -----
.npm_setup:
  before_script: &npm_setup
    - CURRENT_NPM=$(npm --version) && if [ "$CURRENT_NPM" != "${NPM_VERSION}" ]; then npm install --global "npm@${NPM_VERSION}" || true; fi
    - node --version
    - npm --version
    # Harden npm against intermittent registry connectivity failures
    # (ECONNRESET/ETIMEDOUT flakes on the CI runner). Longer, more
    # aggressive retries reduce the flake rate without masking real errors.
    - npm config set fetch-retries 5
    - npm config set fetch-retry-mintimeout 20000
    - npm config set fetch-retry-maxtimeout 120000
    - npm config set fetch-timeout 300000
    - npm ci --legacy-peer-deps

.typecheck_base:
  stage: quality
  image: node:${NODE_VERSION}
  before_script: *npm_setup
  cache: *cache_npm

typecheck:
  extends: .typecheck_base
  script:
    - npm run typecheck --workspace=packages/types
    - npm run typecheck --workspace=packages/utils
    - npm run typecheck --workspace=apps/frontend
    - npm run typecheck --workspace=apps/backend

cms-typecheck:
  extends: .typecheck_base
  before_script:
    # CMS is NOT a root workspace — install and check in its own directory.
    - node --version
    - npm --version
    - npm config set fetch-retries 5
    - npm config set fetch-retry-mintimeout 20000
    - npm config set fetch-retry-maxtimeout 120000
    - npm config set fetch-timeout 300000
    - cd apps/cms && npm ci --legacy-peer-deps && cd ../..
    - cd apps/cms && npm run typecheck
  script:
    - echo "cms typecheck completed"
  cache:
    key:
      files:
        - apps/cms/package-lock.json
    paths:
      - apps/cms/node_modules/

# ----- Lint -----
lint:
  extends: .typecheck_base
  script:
    - npm run lint --workspace=apps/backend
    - npm run lint --workspace=apps/frontend

# ----- Security Scan (replaces CI: security-scan) -----
security-scan:
  extends: .typecheck_base
  script:
    # Report but don't fail pipeline — audit findings are tracked in Security tab
    - npm audit --audit-level=high || true
    # Optional Snyk scan (requires SNYK_TOKEN CI/CD variable)
    - |
      if [ -n "$SNYK_TOKEN" ]; then
        npx --yes snyk@latest auth "$SNYK_TOKEN"
        npx --yes snyk@latest test --severity-threshold=high || true
        npx --yes snyk@latest code test --severity-threshold=high || true
      else
        echo "SNYK_TOKEN not configured; skipping Snyk SCA/SAST."
      fi
  allow_failure: true
  artifacts:
    when: always
    paths:
      - .snyk/
    expire_in: 7 days

# ----- SBOM (Software Bill of Materials) -----
sbom:
  stage: quality
  image: node:${NODE_VERSION}
  before_script: *npm_setup
  # Non-blocking by design (see SECURITY_BASELINE): cyclonedx-npm runs `npm ls`
  # under the hood and fails on monorepo lockfile drift (ELSPROBLEMS) without
  # producing the SBOM. Fix tracked: reconcile root lockfile on Linux (see ADR-010).
  allow_failure: true
  script:
    - npx --yes @cyclonedx/cyclonedx-npm@latest --output-file gl-sbom.json
    - |
      if [ -s gl-sbom.json ]; then
        echo "SBOM generated with $(jq '.components | length' gl-sbom.json) components"
      else
        echo "Warning: SBOM may be incomplete"
      fi
  artifacts:
    when: always
    paths:
      - gl-sbom.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ----- Unit Tests -----
test:
  extends: .typecheck_base
  script:
    - npm run test --workspace=apps/backend
    - npm run test --workspace=apps/frontend
  artifacts:
    when: always
    reports:
      junit:
        - apps/backend/coverage/junit.xml
        - apps/frontend/coverage/junit.xml
    expire_in: 30 days

# ----- Mobile TypeScript & Tests -----
mobile-typecheck:
  extends: .typecheck_base
  script:
    - npm run typecheck --workspace=apps/mobile

mobile-test:
  extends: .typecheck_base
  script:
    - npm run test --workspace=apps/mobile
  artifacts:
    when: always
    reports:
      junit:
        - apps/mobile/coverage/junit.xml
    expire_in: 30 days

# ----------------------------------------------------------------------------
# 2. BUILD STAGE
# ----------------------------------------------------------------------------

# ----- Build all apps/packages -----
build:
  stage: build
  image: node:${NODE_VERSION}
  before_script: *npm_setup
  cache: *cache_npm
  script:
    - npm run build --workspace=packages/types
    - npm run build --workspace=packages/utils
    - npm run build --workspace=apps/frontend
    - npm run build --workspace=apps/backend
  artifacts:
    when: always
    paths:
      - apps/frontend/.next/
      - apps/backend/dist/
      - packages/types/dist/
    expire_in: 1 day

# ----------------------------------------------------------------------------
# 3. CONTAINER IMAGE STAGE
# ----------------------------------------------------------------------------

# ----- Build & push backend image -----
build-image-backend:
  stage: image
  # Serialize image builds: 3 concurrent buildx builds against the single
  # dind daemon cause 'error reading from server: EOF' / session timeouts.
  resource_group: image-builds
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--insecure-registry=19.16.1.100:5050"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker buildx build \
        --tag $BACKEND_IMAGE:$IMAGE_TAG_SHA \
        --tag $BACKEND_IMAGE:$IMAGE_TAG_BRANCH \
        --tag $BACKEND_IMAGE:latest \
        --file apps/backend/Dockerfile \
        --load \
        .
    - docker push $BACKEND_IMAGE:$IMAGE_TAG_SHA
    - docker push $BACKEND_IMAGE:$IMAGE_TAG_BRANCH
    - docker push $BACKEND_IMAGE:latest
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ----- Build & push frontend image -----
build-image-frontend:
  stage: image
  # Serialize image builds: 3 concurrent buildx builds against the single
  # dind daemon cause 'error reading from server: EOF' / session timeouts.
  resource_group: image-builds
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--insecure-registry=19.16.1.100:5050"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker buildx build \
        --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
        --build-arg NEXT_PUBLIC_CMS_URL=$NEXT_PUBLIC_CMS_URL \
        --build-arg NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL \
        --build-arg NEXT_PUBLIC_STRAPI_API_URL=$NEXT_PUBLIC_CMS_URL \
        --tag $FRONTEND_IMAGE:$IMAGE_TAG_SHA \
        --tag $FRONTEND_IMAGE:$IMAGE_TAG_BRANCH \
        --tag $FRONTEND_IMAGE:latest \
        --file apps/frontend/Dockerfile \
        --load \
        .
    - docker push $FRONTEND_IMAGE:$IMAGE_TAG_SHA
    - docker push $FRONTEND_IMAGE:$IMAGE_TAG_BRANCH
    - docker push $FRONTEND_IMAGE:latest
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ----- Build & push CMS image -----
build-image-cms:
  stage: image
  # Serialize image builds: 3 concurrent buildx builds against the single
  # dind daemon cause 'error reading from server: EOF' / session timeouts.
  resource_group: image-builds
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--insecure-registry=19.16.1.100:5050"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker buildx build \
        --tag $CMS_IMAGE:$IMAGE_TAG_SHA \
        --tag $CMS_IMAGE:$IMAGE_TAG_BRANCH \
        --tag $CMS_IMAGE:latest \
        --file apps/cms/Dockerfile \
        --load \
        .
    - docker push $CMS_IMAGE:$IMAGE_TAG_SHA
    - docker push $CMS_IMAGE:$IMAGE_TAG_BRANCH
    - docker push $CMS_IMAGE:latest
  dependencies:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ----------------------------------------------------------------------------
# 4. VALIDATION STAGE (post-build)
# ----------------------------------------------------------------------------

# ----- E2E Tests (Playwright) -----
e2e:
  stage: validate
  image: mcr.microsoft.com/playwright:v1.49.0-noble
  needs: ["build"]
  before_script: *npm_setup
  script:
    - npx playwright install --with-deps chromium
    - npm run build --workspace=apps/frontend
    - npm run test:e2e --workspace=apps/frontend
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ----- Visual Regression -----
visual-regression:
  stage: validate
  image: mcr.microsoft.com/playwright:v1.49.0-noble
  needs: ["build"]
  before_script: *npm_setup
  script:
    - npx playwright install --with-deps chromium
    - npm run build --workspace=apps/frontend
    - npx playwright test --config=e2e/playwright.config.ts --project=visual-regression
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ----- Update Visual Snapshots (manual) -----
update-visual-snapshots:
  stage: validate
  image: mcr.microsoft.com/playwright:v1.49.0-noble
  needs: ["build"]
  before_script: *npm_setup
  script:
    - npx playwright install --with-deps chromium
    - npm run build --workspace=apps/frontend
    - npx playwright test --config=e2e/playwright.config.ts --project=visual-regression --update-snapshots
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# ----- Lighthouse CI -----
lighthouse:
  stage: validate
  image: node:${NODE_VERSION}
  needs: ["build"]
  before_script: *npm_setup
  script:
    - npm run build --workspace=apps/frontend
    - cp -r apps/frontend/.next/static apps/frontend/.next/standalone/apps/frontend/.next/static || true
    - cp -r apps/frontend/public apps/frontend/.next/standalone/apps/frontend/public || true
    - npx --yes @lhci/cli@0.13.x autorun --config=lighthouserc.json
  artifacts:
    when: always
    paths:
      - .lighthouseci/
    expire_in: 7 days
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ----- Bundle Analysis (S-019 P1) -----
# Enforces three bundle-size budgets (S-019 P1 success criteria):
#   - First-load JS per route: 200KB max
#   - Total initial bundle:    500KB max
#   - Largest single chunk:    500KB max
# Exits 1 (fail build) if any threshold is exceeded.
bundle-analysis:
  stage: validate
  image: node:${NODE_VERSION}
  needs: ["build"]
  before_script: *npm_setup
  script:
    - npm run analyze --workspace=apps/frontend
    - node scripts/check-bundle-budgets.mjs
  artifacts:
    when: always
    paths:
      - apps/frontend/.next/analyze/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ----- Container Image Security Scan (Trivy) -----
# Scans the three pushed images for OS + library vulnerabilities.
# Gate policy: CRITICAL fails the pipeline; HIGH/MEDIUM reported as artifacts.
container-scan:
  stage: validate
  image:
    name: aquasec/trivy:latest
    # aquasec/trivy image sets ENTRYPOINT ["trivy"] — GitLab's default wrapper
    # runs `trivy sh -c ...` which fails with `unknown command "sh"`. Override
    # the entrypoint so the script lines execute normally.
    entrypoint: [""]
  needs:
    - build-image-backend
    - build-image-frontend
    - build-image-cms
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_AUTH_URL: $CI_REGISTRY
    TRIVY_NO_PROGRESS: "true"
  script:
    # Full report (all severities) as machine-readable artifacts
    - trivy image --format json --output trivy-backend.json --severity HIGH,CRITICAL $BACKEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --format json --output trivy-frontend.json --severity HIGH,CRITICAL $FRONTEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --format json --output trivy-cms.json --severity HIGH,CRITICAL $CMS_IMAGE:$IMAGE_TAG_SHA
    # Human-readable table to job log
    - trivy image --severity HIGH,CRITICAL $BACKEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --severity HIGH,CRITICAL $FRONTEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --severity HIGH,CRITICAL $CMS_IMAGE:$IMAGE_TAG_SHA
    # Gate: fail only on fixable CRITICAL findings
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $BACKEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $FRONTEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $CMS_IMAGE:$IMAGE_TAG_SHA
  artifacts:
    when: always
    paths:
      - trivy-backend.json
      - trivy-frontend.json
      - trivy-cms.json
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ----------------------------------------------------------------------------
# 5a. MOBILE BUILD STAGE (EAS Build & Submit)
# ----------------------------------------------------------------------------
#
# Requires CI/CD variables:
#   EXPO_TOKEN      — Expo personal access token (generate via expo.dev/accounts)
#   EAS_PROJECT_ID  — UUID from `eas init` run in apps/mobile/
#
# Dependencies: needs typecheck and test from quality stage (not full build).
# Production builds are manual on main branch only.
# ----------------------------------------------------------------------------

build-mobile:
  stage: mobile
  image: node:${NODE_VERSION}
  needs:
    - job: typecheck
    - job: test
    - job: mobile-typecheck
    - job: mobile-test
  before_script: *npm_setup
  cache: *cache_npm
  script:
    - npx eas build --platform all --profile production --non-interactive
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: false

submit-mobile:
  stage: mobile
  image: node:${NODE_VERSION}
  needs:
    - build-mobile
  before_script: *npm_setup
  cache: *cache_npm
  script:
    - npx eas submit --platform all --profile production --non-interactive
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: false

# ----------------------------------------------------------------------------
# 6. PUBLISH STAGE
# ----------------------------------------------------------------------------

# ----- Publish @hexastudio/ui to the GitLab npm Package Registry -----
# Uses CI_JOB_TOKEN (scoped to the pipeline's project) — no manual secrets needed.
# The package is consumed by workspaces in-repo, but publishing makes it
# consumable by external consumers and CI jobs on other runners.
publish-ui:
  stage: publish
  image: node:${NODE_VERSION}
  before_script: *npm_setup
  cache: *cache_npm
  script:
    - npm run typecheck --workspace=packages/ui
    - npm run lint --workspace=packages/ui
    - npm run build --workspace=packages/ui
    # Configure the GitLab npm registry for this job. CI_JOB_TOKEN is scoped
    # to this project and authorized for the Package Registry (api scope).
    - npm config set "@hexastudio:registry" "${CI_SERVER_URL}/api/v4/packages/npm/"
    - npm config set "//${CI_SERVER_HOST}/api/v4/packages/npm/:_authToken" "${CI_JOB_TOKEN}"
    - npm config set "//${CI_SERVER_HOST}/api/v4/packages/npm/:always-auth" "true"
    - npm publish --workspace=packages/ui
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: false

# NOTE (ADR-013): packages/ui was retired — Storybook/docs jobs reference the
# archived package and are disabled (manual, never auto-run). The docs-service
# is commented out of docker-compose.prod.yml. Re-enable only if a design-system
# docs site returns (see docs/adr/archive/packages-ui-snapshot/).
build-storybook:
  stage: publish
  image: node:${NODE_VERSION}
  before_script: *npm_setup
  cache: *cache_npm
  script:
    - npm run build-storybook --workspace=packages/ui
  artifacts:
    when: always
    paths:
      - packages/ui/storybook-static/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true
      when: manual
      allow_failure: true

# ----- Push docs-service container image (serves Storybook static build) -----
build-image-docs:
  stage: publish
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--insecure-registry=19.16.1.100:5050"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCS_IMAGE: $CI_REGISTRY_IMAGE/docs
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker buildx build \
        --tag $DOCS_IMAGE:$IMAGE_TAG_SHA \
        --tag $DOCS_IMAGE:$IMAGE_TAG_BRANCH \
        --tag $DOCS_IMAGE:latest \
        --file packages/ui/Dockerfile \
        --load \
        .
    # Default docker driver cannot --push; load locally then push explicitly.
    - docker push $DOCS_IMAGE:$IMAGE_TAG_SHA
    - docker push $DOCS_IMAGE:$IMAGE_TAG_BRANCH
    - docker push $DOCS_IMAGE:latest
  needs:
    - build-storybook
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true

# ----------------------------------------------------------------------------
# 7. DEPLOY STAGE
# ----------------------------------------------------------------------------

# ----- Production deploy (main branch) -----
deploy-production:
  stage: deploy
  image: alpine:latest
  needs:
    - build-image-backend
    - build-image-frontend
    - build-image-cms
    - build-image-docs
  before_script:
    - apk add --no-cache openssh-client bash
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh -p 22 ${PROD_SERVER_USER}@${PROD_SERVER_IP} << EOF
        set -e
        cd /home/hexa/hexastudio
        git fetch gitlab main
        git reset --hard gitlab/main
        bash scripts/deploy-zero-downtime.sh
        docker image prune -f
        echo "Waiting for services to settle..."
        sleep 15
        docker ps --filter "health=healthy" --format "{{.Names}}" | grep -q "hexa-backend" || { echo "Backend unhealthy"; exit 1; }
        docker ps --filter "health=healthy" --format "{{.Names}}" | grep -q "hexa-frontend" || { echo "Frontend unhealthy"; exit 1; }
        docker ps --filter "health=healthy" --format "{{.Names}}" | grep -q "hexa-cms" || { echo "CMS unhealthy"; exit 1; }
        curl -sf http://localhost:4000/api/health || { echo "API health endpoint unreachable"; exit 1; }
        echo "Deployment verified successfully."
      EOF
  environment:
    name: production
    url: https://hexastudio.net
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: false

# ----- Staging deploy (develop branch) -----
deploy-staging:
  stage: deploy
  image: alpine:latest
  needs:
    - build-image-backend
    - build-image-frontend
    - build-image-cms
    - build-image-docs
  before_script:
    - apk add --no-cache openssh-client bash
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh -p 22 ${STAGING_SERVER_USER}@${STAGING_SERVER_IP} << EOF
        set -e
        cd /home/hexa/hexastudio
        git fetch gitlab develop
        git reset --hard gitlab/develop
        docker compose -f docker-compose.prod.yml pull
        docker compose -f docker-compose.prod.yml up -d --remove-orphans
        docker image prune -f
        docker ps --filter "name=hexa-docs" --format "{{.Names}}" | grep -q "hexa-docs" || { echo "Docs not running"; exit 1; }
      EOF
  environment:
    name: staging
    url: https://staging.hexastudio.net
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"


