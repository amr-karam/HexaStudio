# HEXA STUDIO — GitLab CI/CD Pipeline
# This pipeline enforces the Supreme Law (DESIGN_SYSTEM.md) via the Design Guardrail.

stages:
  - lint
  - test
  - deploy

variables:
  # Node version used for CI
  NODE_VERSION: "22"
  # Suppress noisy warnings from the design guardrail
  HECA_GUARDRAIL_THRESHOLD: "80"

lint:design:
  stage: lint
  image:
    name: node:${NODE_VERSION}
    entrypoint: [""]
  script:
    - echo "Running Design Guardrail..."
    # Make the script executable and run it
    - chmod +x scripts/design-guardrail/guardrail.mjs
    - npx node scripts/design-guardrail/guardrail.mjs
    # If the script exits with code 1, the pipeline fails
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request" || $CI_PIPELINE_SOURCE == "push"
  allow_failure: false

lint:typescript:
  stage: lint
  image:
    name: node:${NODE_VERSION}
    entrypoint: [""]
  script:
    - echo "Running TypeScript typecheck..."
    - npx tsc --noEmit --project apps/frontend/tsconfig.json
    - npx tsc --noEmit --project apps/backend/tsconfig.json

test:frontend:
  stage: test
  image:
    name: node:${NODE_VERSION}
    entrypoint: [""]
  script:
    - echo "Running Frontend Tests..."
    - cd apps/frontend && npm run test --workspace=apps/frontend -- --max-warnings=0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request" || $CI_PIPELINE_SOURCE == "push"

deploy:production:
  stage: deploy
  image:
    name: docker:24
    entrypoint: [""]
  script:
    - echo "Deploying to production..."
    - docker compose -f docker-compose.gitlab.yml up -d
  environment:
    name: production
    url: http://19.16.1.100:8929
  rules:
    - if: $CI_COMMIT_BRANCH == "main"