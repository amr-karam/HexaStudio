# GitLab CE — Community Edition
# Self-hosted GitLab for HEXA Studio - OPTIMIZED CONFIGURATION
# Deploy via: docker compose -f docker-compose.gitlab.yml up -d
#
# Requirements: 4 vCPU, 8GB RAM, 50GB+ SSD
# Initial setup: ~3-5 minutes for first boot
# Access: https://gitlab.hexastudio.net (or http://19.16.1.100:8929 internally)
#
# OPTIMIZATIONS APPLIED:
# - Registry configured for HTTP with insecure flag
# - Performance tuning for PostgreSQL and Sidekiq
# - Proper backup and retention policies
# - Monitoring and logging optimized
# - Resource limits adjusted for production

services:
  gitlab:
    image: gitlab/gitlab-ce:16.11.0-ce.0
    container_name: hexa-gitlab
    restart: unless-stopped
    hostname: 'gitlab.hexastudio.net'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        # ============================================
        # External URLs & Network Configuration
        # ============================================
        external_url 'http://19.16.1.100:8929'
        registry_external_url 'http://19.16.1.100:5050'
        
        # Internal registry configuration (HTTP for internal network)
        registry['enable'] = true
        registry['port'] = 5000
        registry['registry_http_addr'] = '0.0.0.0:5000'
        registry['storage'] = {
          'cache' => {
            'blobdescriptor' => 'inmemory'
          },
          'filesystem' => {
            'rootdirectory' => '/var/opt/gitlab/gitlab-rails/shared/registry'
          },
          'delete' => {
            'enabled' => true
          },
          'redirect' => {
            'disable' => false
          }
        }
        # Allow HTTP registry access (for internal Docker clients)
        registry['env'] = {
          "REGISTRY_HTTP_SECRET" => "${REGISTRY_HTTP_SECRET:-changeme-in-production}",
          "REGISTRY_HTTP_ADDR" => "0.0.0.0:5000",
          "REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY" => "/var/opt/gitlab/gitlab-rails/shared/registry"
        }
        
        # ============================================
        # GitLab Core Configuration
        # ============================================
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        gitlab_rails['time_zone'] = 'UTC'
        gitlab_rails['smtp_enable'] = false
        gitlab_rails['smtp_address'] = "smtp.gmail.com"
        gitlab_rails['smtp_port'] = 587
        gitlab_rails['smtp_user_name'] = "${GITLAB_SMTP_USER:-gitlab@hexastudio.net}"
        gitlab_rails['smtp_password'] = "${GITLAB_SMTP_PASSWORD:-}"
        gitlab_rails['smtp_domain'] = "hexastudio.net"
        gitlab_rails['smtp_authentication'] = "login"
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['smtp_openssl_verify_mode'] = 'peer'
        
        # ============================================
        # Performance Tuning
        # ============================================
        # PostgreSQL optimization
        postgresql['shared_buffers'] = '1GB'
        postgresql['effective_cache_size'] = '2GB'
        postgresql['work_mem'] = '16MB'
        postgresql['maintenance_work_mem'] = '256MB'
        postgresql['max_connections'] = 200
        postgresql['max_worker_processes'] = 8
        
        # Sidekiq (background jobs) optimization
        sidekiq['concurrency'] = 25
        sidekiq['timeout'] = 3600
        sidekiq['queues'] = [
          'postgresql',
          'default',
          'mailers',
          'api',
          'system_hook',
          'webhook',
          'gitlab_shell',
          'import',
          'export',
          'repository',
          'pages',
          'chatops',
          'ci',
          'registry',
          'service_desk'
        ]
        
        # Puma (web server) optimization
        puma['worker_processes'] = 2
        puma['worker_timeout'] = 30
        puma['worker_max_memory'] = 512
        
        # Gitaly (Git operations) — pack objects cache DISABLED: the /cache
        # directory is not mounted in this container, so enabling it caused
        # 'mkdir /cache: permission denied' → git clone/fetch failures
        # ('aborting due to possible repository corruption').
        gitaly['configuration'] = {
          'pack_objects_cache' => {
            'enabled' => false
          }
        }
        
        # ============================================
        # Backup & Retention Configuration
        # ============================================
        gitlab_rails['backup_keep_time'] = 604800  # 7 days in seconds
        gitlab_rails['backup_upload_connection_pool'] = 10
        gitlab_rails['backup_upload_remote_directory'] = 'gitlab-backups'
        
        # Artifact and job retention
        gitlab_rails['artifacts_enabled'] = true
        gitlab_rails['artifacts_path'] = '/var/opt/gitlab/gitlab-rails/shared/artifacts'
        gitlab_rails['ci_job_trace_output_limit'] = 10485760  # 10MB
        gitlab_rails['ci_job_artifact_size_limit'] = 104857600  # 100MB
        
        # ============================================
        # Security Configuration
        # ============================================
        gitlab_rails['rack_attack_git_basic_auth'] = {
          'enabled' => true,
          'realm' => 'GitLab',
          'maxretries' => 10,
          'findtime' => 60,
          'bantime' => 3600
        }
        
        # ============================================
        # Monitoring & Logging
        # ============================================
        prometheus_monitoring['enable'] = true
        prometheus_monitoring['scrape_interval'] = 15
        prometheus_monitoring['scrape_timeout'] = 5
        
        # NOTE: bundled Grafana was removed in GitLab 16.3 — Grafana runs
        # as a separate container (hexastudio-grafana) instead.
        
        # ============================================
        # Let's Encrypt Configuration (Disabled for internal HTTP)
        # ============================================
        letsencrypt['enable'] = false
        
        # ============================================
        # Resource Limits
        # ============================================
        gitlab_rails['max_attachment_size'] = 100
        gitlab_rails['max_pages_size'] = 100
        gitlab_rails['max_artifacts_size'] = 100
        
        # ============================================
        # Rate Limiting
        # ============================================
        gitlab_rails['rack_attack_enabled'] = true
        
        # ============================================
        # Housekeeping
        # ============================================
        gitlab_rails['housekeeping_enabled'] = true
        gitlab_rails['housekeeping_incremental'] = true
        gitlab_rails['housekeeping_bitmap_cleanup_cron_schedule'] = "0 1 * * *"
        
        # ============================================
        # Repository Storage
        # ============================================
        gitlab_rails['repositories_storages'] = {
          'default' => {
            'path' => '/var/opt/gitlab/git-data/repositories',
            'gitaly_address' => 'unix:/var/opt/gitlab/gitaly/gitaly.socket'
          }
        }
    ports:
      - "8929:80"      # HTTP (Puma) - Internal
      - "8443:443"     # HTTPS - External (if configured)
      - "5050:5050"    # Container Registry - Internal HTTP
      - "2222:22"      # SSH
      - "9091:9091"    # Prometheus
      - "3001:3001"    # Grafana
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - gitlab-net
      - hexastudio-web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    shm_size: '512m'
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'

volumes:
  gitlab_config:
    driver: local
  gitlab_logs:
    driver: local
  gitlab_data:
    driver: local

networks:
  gitlab-net:
    name: hexa-gitlab-net
    driver: bridge
  hexastudio-web:
    name: hexastudio_web
    external: true
