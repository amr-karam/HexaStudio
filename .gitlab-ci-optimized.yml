# ⚠️ EXPERIMENTAL ALTERNATIVE — NOT the canonical pipeline.
# Canonical source of truth: .gitlab-ci.yml (see docs/devops/CI_CD_GOVERNANCE.md;
# GitLab CE is the DevOps source of truth per GOVERNANCE.md §13).
# Key differences vs the canonical pipeline:
#   - Different stage set/ordering (validate → quality → build → image → test → deploy)
#   - NO `mobile` stage (canonical stages: quality → build → image → validate → mobile → deploy)
# This file is intentionally retained for evaluation but MUST NOT be treated as
# canonical. It is excluded from scripts/validate-gitlab-ci.js by design.
# ============================================================================
# HEXA Studio — Optimized GitLab CI/CD Pipeline
# ============================================================================
# Optimizations applied:
#   1. Enhanced parallel job execution with proper dependencies
#   2. Multi-level caching (global, per-stage, per-job)
#   3. Smart artifact management with expiration policies
#   4. Pre-build validation gates
#   5. Resource optimization (smaller images, shared runners)
#   6. Security scanning at multiple stages
# ============================================================================

stages:
  - validate
  - quality
  - build
  - image
  - test
  - deploy

variables:
  # Container Registry
  REGISTRY: $CI_REGISTRY
  REGISTRY_IMAGE: $CI_REGISTRY_IMAGE
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  CMS_IMAGE: $CI_REGISTRY_IMAGE/cms
  IMAGE_TAG_SHA: $CI_COMMIT_SHORT_SHA
  IMAGE_TAG_BRANCH: $CI_COMMIT_REF_SLUG
  
  # Node Configuration
  NODE_VERSION: "20.20.2-bookworm-slim"
  NPM_VERSION: "11.17.0"
  
  # Environment
  SKIP_ENV_VALIDATION: "true"
  
  # Caching Configuration
  CACHE_KEY_PREFIX: "hexa-v1"
  
  # Build Arguments
  NEXT_PUBLIC_API_URL: "https://api.hexastudio.net"
  NEXT_PUBLIC_CMS_URL: "https://cms.hexastudio.net"
  NEXT_PUBLIC_SITE_URL: "https://hexastudio.net"

# ---------------------------------------------------------------------------
# Global Cache Templates
# ---------------------------------------------------------------------------

.cache_global: &cache_global
  key: ${CACHE_KEY_PREFIX}-global-${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .npm/
    - .next/cache/
  policy: pull-push
  when: on_success
  unprotect: true

.cache_npm: &cache_npm
  key: ${CACHE_KEY_PREFIX}-npm-${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - apps/*/node_modules/
    - packages/*/node_modules/
  policy: pull-push
  when: on_success

.cache_build: &cache_build
  key: ${CACHE_KEY_PREFIX}-build-${CI_COMMIT_REF_SLUG}
  paths:
    - apps/frontend/.next/cache/
    - apps/backend/dist/
    - packages/types/dist/
    - packages/utils/dist/
  policy: pull-push
  when: on_success

.cache_docker: &cache_docker
  key: ${CACHE_KEY_PREFIX}-docker-${CI_COMMIT_REF_SLUG}
  paths:
    - /tmp/.buildx-cache/
  policy: pull-push
  when: on_success

# ---------------------------------------------------------------------------
# Base Job Templates
# ---------------------------------------------------------------------------

.base_node: &base_node
  image: node:${NODE_VERSION}
  before_script:
    - npm install --global "npm@${NPM_VERSION}"
    - node --version
    - npm --version
    - npm ci --legacy-peer-deps
  cache:
    <<: *cache_npm
    key: ${CACHE_KEY_PREFIX}-npm-${CI_COMMIT_REF_SLUG}
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.base_docker: &base_docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use --name hexa-builder
  cache:
    <<: *cache_docker
  tags:
    - docker
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ---------------------------------------------------------------------------
# STAGE 1: Pre-flight Validation
# ---------------------------------------------------------------------------

validate:compose:
  stage: validate
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker-compose config -q > /dev/null 2>&1 || exit 1
    - docker-compose -f docker-compose.prod.yml config -q > /dev/null 2>&1 || exit 1
  tags:
    - docker

validate:env:
  stage: validate
  extends: .base_node
  script:
    - echo "Validating environment variables..."
    - test -n "$POSTGRES_PASSWORD" || { echo "POSTGRES_PASSWORD not set"; exit 1; }
    - test -n "$JWT_SECRET" || { echo "JWT_SECRET not set"; exit 1; }
    - test -n "$MINIO_ROOT_PASSWORD" || { echo "MINIO_ROOT_PASSWORD not set"; exit 1; }
    - echo "Environment validation passed"

# ---------------------------------------------------------------------------
# STAGE 2: Quality Gate (Parallel Execution)
# ---------------------------------------------------------------------------

quality:lint:
  stage: quality
  extends: .base_node
  script:
    - npm run lint --workspace=apps/backend
    - npm run lint --workspace=apps/frontend
    - npm run lint --workspace=packages/types
    - npm run lint --workspace=packages/ui
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 1 day

quality:typecheck:backend:
  stage: quality
  extends: .base_node
  script:
    - npm run typecheck --workspace=apps/backend
    - npm run typecheck --workspace=packages/types
    - npm run typecheck --workspace=packages/utils

quality:typecheck:frontend:
  stage: quality
  extends: .base_node
  script:
    - npm run typecheck --workspace=apps/frontend
    - npm run typecheck --workspace=packages/ui

quality:typecheck:cms:
  stage: quality
  extends: .base_node
  script:
    - cd apps/cms && npm run typecheck

quality:security-scan:
  stage: quality
  extends: .base_node
  script:
    - npm audit --audit-level=critical
    - |
      if [ -n "$SNYK_TOKEN" ]; then
        npx --yes snyk@latest auth "$SNYK_TOKEN"
        npx --yes snyk@latest test --severity-threshold=critical || true
        npx --yes snyk@latest code test --severity-threshold=critical || true
      else
        echo "SNYK_TOKEN not configured; skipping Snyk"
      fi
  allow_failure: true
  artifacts:
    when: always
    paths:
      - .snyk/
    expire_in: 7 days

quality:sbom:
  stage: quality
  extends: .base_node
  script:
    - npx --yes @cyclonedx/cyclonedx-npm@latest --output-file gl-sbom.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - gl-sbom.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ---------------------------------------------------------------------------
# STAGE 3: Build (Parallel Execution)
# ---------------------------------------------------------------------------

build:frontend:
  stage: build
  extends: .base_node
  cache:
    <<: *cache_npm
    key: ${CACHE_KEY_PREFIX}-npm-${CI_COMMIT_REF_SLUG}
    <<: *cache_build
    key: ${CACHE_KEY_PREFIX}-build-frontend-${CI_COMMIT_REF_SLUG}
  script:
    - npm run build --workspace=apps/frontend
  artifacts:
    when: on_success
    paths:
      - apps/frontend/.next/
    expire_in: 1 day
  needs:
    - job: quality:lint
    - job: quality:typecheck:frontend

build:backend:
  stage: build
  extends: .base_node
  cache:
    <<: *cache_npm
    key: ${CACHE_KEY_PREFIX}-npm-${CI_COMMIT_REF_SLUG}
    <<: *cache_build
    key: ${CACHE_KEY_PREFIX}-build-backend-${CI_COMMIT_REF_SLUG}
  script:
    - npm run build --workspace=apps/backend
    - npm run build --workspace=packages/types
    - npm run build --workspace=packages/utils
  artifacts:
    when: on_success
    paths:
      - apps/backend/dist/
      - packages/types/dist/
      - packages/utils/dist/
    expire_in: 1 day
  needs:
    - job: quality:lint
    - job: quality:typecheck:backend

build:cms:
  stage: build
  extends: .base_node
  cache:
    <<: *cache_npm
    key: ${CACHE_KEY_PREFIX}-npm-${CI_COMMIT_REF_SLUG}
    <<: *cache_build
    key: ${CACHE_KEY_PREFIX}-build-cms-${CI_COMMIT_REF_SLUG}
  script:
    - npm run build --workspace=apps/cms
  artifacts:
    when: on_success
    paths:
      - apps/cms/build/
    expire_in: 1 day
  needs:
    - job: quality:lint
    - job: quality:typecheck:cms

# ---------------------------------------------------------------------------
# STAGE 4: Container Images (Parallel Build & Push)
# ---------------------------------------------------------------------------

build-image:backend:
  stage: image
  extends: .base_docker
  script:
    - |
      docker buildx build \
        --cache-from type=registry,ref=$BACKEND_IMAGE:buildcache \
        --cache-to type=registry,ref=$BACKEND_IMAGE:buildcache,mode=max \
        --tag $BACKEND_IMAGE:$IMAGE_TAG_SHA \
        --tag $BACKEND_IMAGE:$IMAGE_TAG_BRANCH \
        --tag $BACKEND_IMAGE:latest \
        --file apps/backend/Dockerfile \
        --push \
        .
  needs:
    - job: build:backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-image:frontend:
  stage: image
  extends: .base_docker
  script:
    - |
      docker buildx build \
        --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
        --build-arg NEXT_PUBLIC_CMS_URL=$NEXT_PUBLIC_CMS_URL \
        --build-arg NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL \
        --build-arg NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN \
        --cache-from type=registry,ref=$FRONTEND_IMAGE:buildcache \
        --cache-to type=registry,ref=$FRONTEND_IMAGE:buildcache,mode=max \
        --tag $FRONTEND_IMAGE:$IMAGE_TAG_SHA \
        --tag $FRONTEND_IMAGE:$IMAGE_TAG_BRANCH \
        --tag $FRONTEND_IMAGE:latest \
        --file apps/frontend/Dockerfile \
        --push \
        .
  needs:
    - job: build:frontend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-image:cms:
  stage: image
  extends: .base_docker
  script:
    - |
      docker buildx build \
        --cache-from type=registry,ref=$CMS_IMAGE:buildcache \
        --cache-to type=registry,ref=$CMS_IMAGE:buildcache,mode=max \
        --tag $CMS_IMAGE:$IMAGE_TAG_SHA \
        --tag $CMS_IMAGE:$IMAGE_TAG_BRANCH \
        --tag $CMS_IMAGE:latest \
        --file apps/cms/Dockerfile \
        --push \
        .
  needs:
    - job: build:cms
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# STAGE 5: Testing & Validation (Parallel)
# ---------------------------------------------------------------------------

test:unit:backend:
  stage: test
  extends: .base_node
  cache:
    <<: *cache_npm
  script:
    - npm run test --workspace=apps/backend
  artifacts:
    when: always
    reports:
      junit:
        - apps/backend/coverage/junit.xml
    expire_in: 30 days
  needs:
    - job: build:backend

-test:unit:frontend:
  stage: test
  extends: .base_node
  cache:
    <<: *cache_npm
  script:
    - npm run test --workspace=apps/frontend
  artifacts:
    when: always
    reports:
      junit:
        - apps/frontend/coverage/junit.xml
    expire_in: 30 days
  needs:
    - job: build:frontend

test:e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.49.0-noble
  needs:
    - job: build:frontend
  before_script:
    - npm install --global "npm@${NPM_VERSION}"
    - npm ci --legacy-peer-deps
    - npx playwright install --with-deps chromium
  script:
    - npm run build --workspace=apps/frontend
    - npm run test:e2e --workspace=apps/frontend
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

test:lighthouse:
  stage: test
  extends: .base_node
  needs:
    - job: build:frontend
  script:
    - npm run build --workspace=apps/frontend
    - cp -r apps/frontend/.next/static apps/frontend/.next/standalone/apps/frontend/.next/static || true
    - cp -r apps/frontend/public apps/frontend/.next/standalone/apps/frontend/public || true
    - npx --yes @lhci/cli@0.13.x autorun --config=lighthouserc.json
  artifacts:
    when: always
    paths:
      - .lighthouseci/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

test:container-scan:
  stage: test
  image: aquasec/trivy:latest
  needs:
    - job: build-image:backend
    - job: build-image:frontend
    - job: build-image:cms
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_AUTH_URL: $CI_REGISTRY
    TRIVY_NO_PROGRESS: "true"
  script:
    # Generate JSON reports
    - trivy image --format json --output trivy-backend.json --severity HIGH,CRITICAL $BACKEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --format json --output trivy-frontend.json --severity HIGH,CRITICAL $FRONTEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --format json --output trivy-cms.json --severity HIGH,CRITICAL $CMS_IMAGE:$IMAGE_TAG_SHA
    # Human-readable output
    - trivy image --severity HIGH,CRITICAL $BACKEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --severity HIGH,CRITICAL $FRONTEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --severity HIGH,CRITICAL $CMS_IMAGE:$IMAGE_TAG_SHA
    # Fail on CRITICAL vulnerabilities
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $BACKEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $FRONTEND_IMAGE:$IMAGE_TAG_SHA
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed $CMS_IMAGE:$IMAGE_TAG_SHA
  artifacts:
    when: always
    paths:
      - trivy-backend.json
      - trivy-frontend.json
      - trivy-cms.json
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ---------------------------------------------------------------------------
# STAGE 6: Deployment
# ---------------------------------------------------------------------------

deploy:staging:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build-image:backend
    - job: build-image:frontend
    - job: build-image:cms
    - job: test:container-scan
  before_script:
    - apk add --no-cache openssh-client bash git curl
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh -o ConnectTimeout=10 -p 22 ${STAGING_SERVER_USER}@${STAGING_SERVER_IP} << 'DEPLOY_EOF'
        set -e
        cd /home/hexa/hexastudio
        echo "=== Starting Staging Deployment ==="
        
        # Pull latest changes
        git fetch gitlab develop
        git reset --hard gitlab/develop
        
        # Pull new images
        docker compose -f docker-compose.staging.yml pull
        
        # Stop and remove old containers
        docker compose -f docker-compose.staging.yml down --remove-orphans
        
        # Start new containers
        docker compose -f docker-compose.staging.yml up -d
        
        # Clean up unused images
        docker image prune -f
        
        # Verify deployment
        echo "Waiting for services to settle..."
        sleep 30
        
        # Health checks
        for service in hexa-backend-staging hexa-frontend-staging hexa-cms-staging; do
          if ! docker ps --filter "name=$service" --filter "health=healthy" --format "{{.Names}}" | grep -q "$service"; then
            echo "ERROR: $service is not healthy"
            exit 1
          fi
          echo "✓ $service is healthy"
        done
        
        # Test endpoints
        curl -sf http://localhost:14000/api/health || { echo "API health check failed"; exit 1; }
        curl -sf http://localhost:13000 || { echo "Frontend health check failed"; exit 1; }
        curl -sf http://localhost:11337/_health || { echo "CMS health check failed"; exit 1; }
        
        echo "=== Staging Deployment Verified Successfully ==="
      DEPLOY_EOF
  environment:
    name: staging
    url: https://staging.hexastudio.net
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
      when: manual

deploy:production:blue-green:
  stage: deploy
  image: alpine:latest
  needs:
    - job: build-image:backend
    - job: build-image:frontend
    - job: build-image:cms
    - job: test:container-scan
  before_script:
    - apk add --no-cache openssh-client bash git curl
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh -o ConnectTimeout=10 -p 22 ${PROD_SERVER_USER}@${PROD_SERVER_IP} << 'DEPLOY_EOF'
        set -e
        cd /home/hexa/hexastudio
        echo "=== Starting Blue-Green Production Deployment ==="
        
        # Pull latest changes
        git fetch gitlab main
        git reset --hard gitlab/main
        
        # Deploy green environment
        docker compose -f docker-compose.green.yml pull
        docker compose -f docker-compose.green.yml up -d
        
        # Wait for green to be healthy
        echo "Waiting for green services to be healthy..."
        sleep 60
        
        for service in hexa-backend-green hexa-frontend-green hexa-cms-green; do
          if ! docker ps --filter "name=$service" --filter "health=healthy" --format "{{.Names}}" | grep -q "$service"; then
            echo "ERROR: $service (green) is not healthy"
            exit 1
          fi
          echo "✓ $service (green) is healthy"
        done
        
        # Test green endpoints
        curl -sf http://localhost:4000/api/health || { echo "Green API health check failed"; exit 1; }
        curl -sf http://localhost:3000 || { echo "Green Frontend health check failed"; exit 1; }
        curl -sf http://localhost:1337/_health || { echo "Green CMS health check failed"; exit 1; }
        
        # Update Traefik weights (shift 100% to green)
        echo "=== Shifting traffic to green (100%) ==="
        # This would update the dynamic-green.yml file to change weights
        # For now, we'll just restart with green as primary
        
        # Stop blue services
        docker stop hexa-backend-blue hexa-frontend-blue hexa-cms-blue || true
        
        # Update container names to promote green to blue
        docker rename hexa-backend-green hexa-backend-blue
        docker rename hexa-frontend-green hexa-frontend-blue
        docker rename hexa-cms-green hexa-cms-blue
        
        # Clean up old green containers
        docker compose -f docker-compose.green.yml down --remove-orphans
        
        # Clean up images
        docker image prune -f
        
        echo "=== Blue-Green Deployment Completed Successfully ==="
        echo "Traffic is now 100% on the new deployment"
      DEPLOY_EOF
  environment:
    name: production
    url: https://hexastudio.net
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: false

# ---------------------------------------------------------------------------
# Pipeline Configuration
# ---------------------------------------------------------------------------

# Default workflow rules
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Auto-cancel redundant pipelines
concurrency:
  group: ${CI_COMMIT_REF_NAME}-${CI_JOB_STAGE}
  cancel_in_progress: true

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------

# Configure job failure notifications
# (Requires GitLab integration with Slack/Email)
