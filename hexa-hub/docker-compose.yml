# =============================================================================
# HEXA Hub — Local Development Docker Compose
# =============================================================================
# Usage:
#   cp .env.example .env   # create your local env file
#   docker compose up -d   # start all services
#   docker compose logs -f # tail logs
#
# Services:
#   postgres  — PostgreSQL 16         :5432
#   redis     — Redis 7 (AOF)         :6379
#   minio     — MinIO S3              :9000 (API)  :9001 (Console)
#   api       — NestJS gateway        :3000
#   web       — Next.js frontend      :3001
#   realtime  — Socket.IO server      :3002
#   worker    — BullMQ background     (no exposed port)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-hub_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hub_password}
      POSTGRES_DB: ${DB_NAME:-hub_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hexa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hub_user} -d ${DB_NAME:-hub_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 — Cache, Pub/Sub, BullMQ broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hexa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: hub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - hexa-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # MinIO Init — Create default bucket on first run
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: hub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - hexa-network
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/${MINIO_BUCKET:-hexa-docs};
        mc anonymous set download local/${MINIO_BUCKET:-hexa-docs};
        echo 'MinIO bucket initialized.';
      "
    restart: "no"

  # ---------------------------------------------------------------------------
  # NestJS API Gateway
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: hub-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-hub_user}
      DB_PASSWORD: ${DB_PASSWORD:-hub_password}
      DB_NAME: ${DB_NAME:-hub_db}
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      DB_RUN_MIGRATIONS: "true"

      # Redis
      REDIS_URL: redis://redis:6379

      # JWT
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

      # Odoo
      ODOO_URL: ${ODOO_URL:-}
      ODOO_DB: ${ODOO_DB:-}
      ODOO_USERNAME: ${ODOO_USERNAME:-}
      ODOO_PASSWORD: ${ODOO_PASSWORD:-}
      ODOO_WEBHOOK_SECRET: ${ODOO_WEBHOOK_SECRET:-}

      # MinIO
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-hexa-docs}

      # AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001,http://localhost:3002}
    networks:
      - hexa-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Next.js Web Frontend
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
        NEXT_PUBLIC_REALTIME_URL: http://localhost:3002
    container_name: hub-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:3002}
    networks:
      - hexa-network
    depends_on:
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Socket.IO Realtime Server
  # ---------------------------------------------------------------------------
  realtime:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
      target: runner
    container_name: hub-realtime
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      PORT: "3001"
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
    networks:
      - hexa-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # BullMQ Background Worker
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: runner
    container_name: hub-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Worker needs API URL for internal callbacks
      API_URL: http://api:3000

      # SMTP (email delivery)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@hexastudio.net}

      # AI
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - hexa-network
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

# =============================================================================
# Networks
# =============================================================================
networks:
  hexa-network:
    driver: bridge
    name: hexa-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    name: hub-postgres-data
  redis_data:
    name: hub-redis-data
  minio_data:
    name: hub-minio-data
