# ─── HEXA Hub — Prometheus Scrape Configuration ─────────────────────────────
# Scrapes metrics from the NestJS API server's /metrics endpoint.
# ───────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'hexa-hub-api'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets:
          - 'hub-api:3000'
        labels:
          service: 'api'
          environment: 'production'

  - job_name: 'hexa-hub-api-dev'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets:
          - 'localhost:3001'
        labels:
          service: 'api'
          environment: 'development'

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
