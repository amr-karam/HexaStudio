[options]
; HEXA Studio Odoo Configuration - Staging
; This file is mounted at /etc/odoo/odoo.conf

; Database
db_host = postgres
db_port = 5432
db_user = hexastudio
db_password = ${POSTGRES_PASSWORD}
db_name = hexastudio_odoo

; Server
http_interface = 0.0.0.0
http_port = 8069
longpolling_port = 8072
workers = 2
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

; Security
admin_passwd = ${ODOO_MASTER_PASSWORD}
list_db = False
proxy_mode = True

; Logging
log_level = info
logfile = /var/log/odoo/odoo.log
log_handler = [':INFO']

; Addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons

; Performance
cache_size = 100
limit_memory = 1024