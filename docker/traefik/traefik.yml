global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

entrypoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: cloudflare
  metrics:
    address: ":9090"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  cloudflare:
    cloudflare:
      email: ${CLOUDFLARE_EMAIL}
      apiKey: ${CLOUDFLARE_API_KEY}

accessLog:
  filePath: /var/log/traefik/access.log
  format: json

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

ping:
  entryPoint: web

tracing:
  jaeger:
    endpoint: http://tempo:4318/jaeger
    sampler:
      type: const
      param: 1.0