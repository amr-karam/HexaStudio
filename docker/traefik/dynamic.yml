http:
  routers:
    # Main Website (Non-WWW)
    website:
      rule: "Host(`hexastudio.net`)"
      service: frontend

    # Main Website (WWW — serve same content, no redirect needed)
    website-www:
      rule: "Host(`www.hexastudio.net`)"
      service: frontend

    # Backend API
    api:
      rule: "Host(`api.hexastudio.net`)"
      service: backend
      middlewares:
        - security-headers

    # CMS
    cms:
      rule: "Host(`cms.hexastudio.net`)"
      service: cms
      middlewares:
        - security-headers

    # ERP / Odoo
    odoo:
      rule: "Host(`odoo.hexastudio.net`)"
      service: odoo
      middlewares:
        - forwarded-headers
        - security-headers

    # Storage / Files
    files:
      rule: "Host(`files.hexastudio.net`)"
      service: minio
      middlewares:
        - security-headers

    # Storage Console
    files-console:
      rule: "Host(`files-console.hexastudio.net`)"
      service: minio-console
      middlewares:
        - security-headers

    # Monitoring (Grafana)
    monitor:
      rule: "Host(`grafana.hexastudio.net`)"
      service: grafana
      middlewares:
        - security-headers

    # Monitoring (Prometheus)
    prometheus:
      rule: "Host(`prometheus.hexastudio.net`)"
      service: prometheus
      middlewares:
        - security-headers

    # Monitoring (Alertmanager UI — basic auth via traefik-auth)
    alertmanager:
      rule: "Host(`alertmanager.hexastudio.net`)"
      service: alertmanager
      middlewares:
        - traefik-auth
        - security-headers

    # Uptime
    uptime:
      rule: "Host(`uptime.hexastudio.net`)"
      service: uptime-kuma
      middlewares:
        - security-headers

    # Auth
    auth:
      rule: "Host(`auth.hexastudio.net`)"
      service: auth-service
      middlewares:
        - security-headers

    # Analytics
    analytics:
      rule: "Host(`analytics.hexastudio.net`)"
      service: analytics-service
      middlewares:
        - security-headers

    # Communication Hub
    hub:
      rule: "Host(`hub.hexastudio.net`)"
      service: hub-service
      middlewares:
        - security-headers

    # Documentation
    docs:
      rule: "Host(`docs.hexastudio.net`)"
      service: docs-service
      middlewares:
        - security-headers

    # Status Page
    status:
      rule: "Host(`status.hexastudio.net`)"
      service: status-service
      middlewares:
        - security-headers

    # GitLab (TLS terminated at Cloudflare edge)
    gitlab:
      rule: "Host(`gitlab.hexastudio.net`)"
      service: gitlab
      entrypoints:
        - web

  services:
    frontend:
      loadBalancer:
        servers: [{ url: "http://frontend:3000" }]
    backend:
      loadBalancer:
        servers: [{ url: "http://backend:4000" }]
    cms:
      loadBalancer:
        servers: [{ url: "http://cms:1337" }]
    odoo:
      loadBalancer:
        servers: [{ url: "http://odoo:8069" }]
    minio:
      loadBalancer:
        servers: [{ url: "http://minio:9000" }]
    minio-console:
      loadBalancer:
        servers: [{ url: "http://minio-console:9001" }]
    grafana:
      loadBalancer:
        servers: [{ url: "http://grafana:3000" }]
    prometheus:
      loadBalancer:
        servers: [{ url: "http://prometheus:9090" }]
    alertmanager:
      loadBalancer:
        servers: [{ url: "http://alertmanager:9093" }]
    uptime-kuma:
      loadBalancer:
        servers: [{ url: "http://uptime-kuma:3001" }]
    auth-service:
      loadBalancer:
        servers: [{ url: "http://auth-service:8080" }]
    analytics-service:
      loadBalancer:
        servers: [{ url: "http://analytics-service:8080" }]
    hub-service:
      loadBalancer:
        servers: [{ url: "http://hub-service:8080" }]
    docs-service:
      loadBalancer:
        servers: [{ url: "http://docs-service:8080" }]
    status-service:
      loadBalancer:
        servers: [{ url: "http://status-service:8080" }]

    gitlab:
      loadBalancer:
        servers: [{ url: "http://hexa-gitlab:80" }]

  middlewares:
    # Traefik dashboard / Alertmanager basic auth — credentials from env.
    # Generate the hash: htpasswd -nbB admin '<password>'
    # TRAEFIK_AUTH_USER and TRAEFIK_AUTH_HASH are required in .env (no default fallback).
    traefik-auth:
      basicAuth:
        users:
          - "${TRAEFIK_AUTH_USER}:${TRAEFIK_AUTH_HASH}"

    # www → non-www redirect — prevents infinite loop
    forwarded-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Forwarded-Ssl: "on"

    # Security headers applied at the proxy edge (non-frontend services).
    # The Next.js frontend sets its own tailored CSP via next.config.ts; adding
    # a proxy-level CSP there would duplicate headers, so `website` is exempt.
    # Baseline per docs/security/SECURITY_BASELINE.md §Security Headers.
    security-headers:
      headers:
        customResponseHeaders:
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "SAMEORIGIN"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Permissions-Policy: "camera=(), microphone=(), geolocation=(), xr-spatial-tracking=(self)"
          Content-Security-Policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
