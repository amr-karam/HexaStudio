# HEXA STUDIO Docs (Storybook) — nginx server config
# Listens on 8080 to match the Traefik docs router load balancer target.
server {
    listen 8080;
    server_name docs.hexastudio.net;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets get long-lived immutable cache (content-hashed by Storybook).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /sb-common-assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /sb-addons/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /sb-manager/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
