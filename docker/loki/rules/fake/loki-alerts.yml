groups:
  - name: loki-logs
    interval: 30s
    rules:
      # Error rate alerts
      - alert: HighErrorRateLogs
        expr: |
          sum(rate({job=~"backend|frontend"} |= "error" |~ "(?i)error|exception|fail" [5m])) 
          / sum(rate({job=~"backend|frontend"} |~ ".*" [5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in logs"
          description: "Error log rate is {{ $value | printf \"%.2f\" }}% (threshold: 5%)"

      - alert: CriticalErrorRateLogs
        expr: |
          sum(rate({job=~"backend|frontend"} |= "error" |~ "(?i)critical|fatal|panic" [5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical errors detected in logs"
          description: "Critical/fatal errors detected in {{ $labels.job }}"

      # Exception spikes
      - alert: ExceptionSpike
        expr: |
          sum(rate({job="backend"} |~ "(?i)exception|traceback|stack trace" [5m])) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Exception spike detected"
          description: "Exception rate is {{ $value | printf \"%.2f\" }}/sec"

      # Slow query logs
      - alert: SlowQueryLogSpike
        expr: |
          sum(rate({job="backend"} |~ "(?i)slow query|query took|duration.*[0-9]+ms" [5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow query log spike"
          description: "Slow query log rate is {{ $value | printf \"%.2f\" }}/sec"

      # Authentication failures
      - alert: AuthFailureSpike
        expr: |
          sum(rate({job=~"backend|frontend"} |~ "(?i)unauthorized|authentication failed|invalid token|jwt.*expired" [5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Authentication failure spike"
          description: "Auth failure rate is {{ $value | printf \"%.2f\" }}/sec"

      # Database connection issues
      - alert: DatabaseConnectionErrors
        expr: |
          sum(rate({job="backend"} |~ "(?i)connection.*refused|connection.*timeout|pool.*exhausted|econnrefused|etimedout" [5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection errors"
          description: "Database connection errors detected"

      # Memory/GC pressure in logs
      - alert: GCPressureLogs
        expr: |
          sum(rate({job="backend"} |~ "(?i)gc.*pause|memory.*pressure|heap.*exhausted|out of memory" [5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GC/Memory pressure in logs"
          description: "GC or memory pressure messages detected"

      # Security events
      - alert: SecurityEventDetected
        expr: |
          sum(rate({job=~"backend|frontend|nginx"} |~ "(?i)sql injection|xss|csrf|path traversal|brute force|rate limit exceeded" [5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Security event detected in logs"
          description: "Security event: {{ $labels.job }} - {{ $labels.level }}"

      # Deployment failures
      - alert: DeploymentFailure
        expr: |
          sum(rate({job=~"backend|frontend"} |~ "(?i)deployment failed|build failed|rollback" [5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Deployment failure detected"
          description: "Deployment failure mentioned in logs"

      # Health check failures
      - alert: HealthCheckFailures
        expr: |
          sum(rate({job=~"backend|frontend"} |~ "(?i)health check failed|readiness probe failed|liveness probe failed" [5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Health check failures in logs"
          description: "Health check failures detected"

  # ---------------------------------------------------------------------------
  # Backup & MinIO mirror alerting — closes the "no alerting on verification
  # failure" gap (docs/devops/BACKUP.md §8). Selectors target the promtail
  # `container` label (docker container_name, e.g. hexastudio-backup-verify-scheduled-1).
  # LogQL `=~` regexes are anchored full-match, so the `.*` prefix is required.
  # Tokens are unique to failure paths in docker/backup/*.sh — no false
  # positives on "Verification PASSED", "[FAIL]" (minio-verify), or the
  # "... 0 failed." summary line.
  # ---------------------------------------------------------------------------
  - name: hexa-backup
    interval: 30s
    rules:
      # Daily scheduled backup verification FAILED (docker/backup/verify-loop.sh,
      # container backup-verify-scheduled). Fires on a single failure line and
      # auto-resolves ~5m later; re-fires on the next failed 24h run.
      - alert: BackupVerificationFailed
        expr: |
          count_over_time({job="containerlogs", container=~".*backup-verify-scheduled.*"} |= "Verification FAILED" [5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backup verification FAILED"
          description: "Scheduled backup verification failed in container {{ $labels.container }} — inspect the verify-backup.sh output above; next attempt in 24h."

      # At least one MinIO asset-bucket mirror failed this cycle
      # (docker/backup/minio-backup.sh, container minio-backup). Only the exact
      # per-bucket "FAIL:" line matches — the summary line ("N bucket(s) OK, M
      # failed.") is deliberately NOT matched, so "0 failed" never fires.
      - alert: MinioBackupCycleFailed
        expr: |
          count_over_time({job="containerlogs", container=~".*minio-backup.*"} |= "FAIL:" [1h]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "MinIO asset mirror cycle reported failures"
          description: "minio-backup logged one or more 'FAIL:' lines in the last hour (container {{ $labels.container }}) — a bucket was not mirrored this cycle and will be retried in 24h."

      # MinIO backup container hit a fail-fast FATAL: missing MINIO_SECRET_KEY,
      # 'mc' client unavailable, or MinIO unreachable (docker/backup/minio-backup.sh
      # exits 1 on these, so the container stops/restarts and the logs persist).
      - alert: MinioBackupFatal
        expr: |
          count_over_time({job="containerlogs", container=~".*minio-backup.*"} |= "FATAL:" [15m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MinIO backup service FATAL error"
          description: "minio-backup logged a FATAL error (container {{ $labels.container }}) — missing MINIO_SECRET_KEY, 'mc' unavailable, or MinIO unreachable. The service exited non-zero and will restart."
