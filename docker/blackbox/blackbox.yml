# Blackbox exporter modules — probed by Prometheus `blackbox` job.
# See docker/prometheus/prometheus.yml (job_name: blackbox).
modules:
  http_2xx:
    prober: http
    # 15s: the hairpin path (server -> Cloudflare edge -> tunnel -> origin)
    # adds several seconds; internal latency is <1s. UptimeProbeSlow alerts
    # when probe_duration_seconds > 3s for 5m.
    timeout: 15s
    http:
      valid_status_codes: [200, 301, 302, 307, 308]
      follow_redirects: true
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: false
