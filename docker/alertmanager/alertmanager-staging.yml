global:
  resolve_timeout: 5m
  smtp_smarthost: ''
  smtp_from: 'alertmanager@staging.hexastudio.net'
  smtp_auth_username: ''
  smtp_auth_password: ''

route:
  group_by: ['alertname', 'job', 'environment']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true

receivers:
  - name: 'default'
    email_configs:
      - to: 'alerts@staging.hexastudio.net'
        send_resolved: true
    webhook_configs:
      - url: 'http://webhook:5000/alert'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: 'critical-alerts@staging.hexastudio.net'
        send_resolved: true
    webhook_configs:
      - url: 'http://webhook:5000/alert/critical'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']